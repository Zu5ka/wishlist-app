<tr id="item-{{ item.id }}">
    <td class="uk-table-shrink">
        <input type="checkbox"
               hx-target="#item-{{ item.id }}"
               {% if current_user.id == list.user_id %}
                    hx-patch="{{ url_for('views.claim_item', id=item.id) }}"
                    hx-swap="outerHTML"
                    {% if item.state == ItemState.claimed %} checked {% endif %}
               {% else %}
                    hx-patch="{{ url_for('views.reserve_item', id=item.id) }}"
                    hx-swap="none"
                    {% if item.state == ItemState.reserved %} checked {% endif %}
               {% endif %}>
    </td>
    <td class="uk-table-expand">{{ item.name }}</td>
    <td class="uk-table-shrink">
        {% if current_user.id == list.user_id %}
        <a href=""
           uk-icon="icon: trash"
           hx-delete="{{ url_for('views.delete_item', id=item.id) }}"
           hx-target="#item-{{ item.id }}"
           hx-swap="delete"
           hx-confirm="Opravdu chcete tuto položku smazat?"
        ></a>
        {% endif %}
    </td>
</tr>
