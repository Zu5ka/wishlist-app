<tr id="item-{{ item.id }}">
    <td class="uk-table-shrink">
        <input class="uk-checkbox"
               type="checkbox"
               {% if current_user.id == list.user_id %}
                    hx-post="{{ url_for('views.claim_item', id=item.id) }}"
                    {% if item.state == 2 %} checked {% endif %}
               {% else %}
                    hx-post="{{ url_for('views.reserve_item', id=item.id) }}"
                    {% if item.state == 1 %} checked {% endif %}
               {% endif %}
               hx-target="#item-{{ item.id }}"
               hx-swap="outerHTML"
        >
    </td>
    <td class="uk-table-expand">{{ item.name }}</td>
    <td class="uk-table-shrink">
        {% if current_user.id == list.user_id %}
        <a href=""
           uk-icon="icon: trash"
           hx-delete="{{ url_for('views.delete_item', id=item.id) }}"
           hx-target="#item-{{ item.id }}"
           hx-swap="delete"
           hx-confirm="Opravdu chcete tuto položku smazat?"
        ></a>
        {% endif %}
    </td>
</tr>
