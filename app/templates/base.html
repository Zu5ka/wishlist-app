<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- UIkit CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.21.17/dist/css/uikit.min.css" />

    <!-- UIkit JS -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.17/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.17/dist/js/uikit-icons.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body hx-boost>
    {% block content %}{% endblock %}

    <!-- This part of code is copied from https://stackoverflow.com/a/73593579 -->
    <script>
        document.body.addEventListener('htmx:beforeOnLoad', function(evt) {
            if (evt.detail.xhr.status >= 400 && evt.detail.xhr.status < 500) {
                evt.detail.shouldSwap = true;
                evt.detail.idError = false;
            }
        });
    </script>

</body>
</html>
