{% extends "base.html" %}

{% block content %}
<main uk-grid class="uk-grid-collapse">
    <aside class="uk-padding uk-width-1-4@m uk-background-muted">
        <div class="uk-flex uk-flex-between uk-flex-middle">
            <span class="uk-margin-remove uk-text-large">{{ current_user.username }}</span>
            <a href="" uk-icon="icon: sign-out" hx-post="{{ url_for('auth.logout') }}"
               hx-confirm="Opravdu se chcete odhlásit?"></a>
        </div>
        <hr>

        <a class="uk-button uk-button-default uk-margin-xsmall uk-width-1-1" href="#modal-sections" uk-toggle>Nový
            seznam</a>
        <div id="modal-sections" uk-modal>
            <div class="uk-modal-dialog">
                <button class="uk-modal-close-default" type="button" uk-close></button>
                <div class="uk-modal-header">
                    <h2 class="uk-modal-title">Nový seznam</h2>
                </div>
                <div class="uk-modal-body">
                    <form id="new_list_form">
                        <input class="uk-input uk-margin-xsmall-bottom" type="text" placeholder="název seznamu"
                               name="list_name" required>
                    </form>
                    <span id="errors" class="uk-text-danger"></span>
                </div>
                <div class="uk-modal-footer uk-text-right">
                    <!-- TODO: dialog shouldnt close until succes -->
                    <button class="uk-button uk-button-default uk-modal-close" type="button">Zrušit</button>
                    <button class="uk-button uk-button-primary uk-modal-close"
                            type="button"
                            hx-post="{{ url_for('views.add_list') }}"
                            hx-include="#new_list_form"
                            hx-target="#my_lists"
                            hx-swap="beforeend"
                    >Vytvořit
                    </button>
                </div>
            </div>
        </div>

        {% include "_partials/_lists.html" %}

    </aside>

    <div id="list_content" class="uk-width-expand@m uk-flex uk-flex-center">
        <div class="uk-flex uk-flex-center uk-flex-middle placeholder">
            Vyber list ze seznamu
        </div>
    </div>
</main>

{% endblock %}
